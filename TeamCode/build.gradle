apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

// ---- Build info (2026-11-07) ----
// Every build writes util/BuildInfo.java with the git commit, the branch, the PC clock and, when the working tree has changes that are not committed, a fingerprint of them, so a run log
// (its second line, "# Build: ...") says exactly which code was on the robot. With changes the commit alone is not the code: the tracked diff is saved to build-history/<commit>-<fingerprint>.patch
// (untracked new files are in the fingerprint but not saved) and every build adds a line to build-history/builds.csv (both ignored by git). If git is not found the fields say "unknown".
def buildInfoDir = layout.buildDirectory.dir('generated/buildinfo')
tasks.register('generateBuildInfo') {
    outputs.dir(buildInfoDir)
    outputs.upToDateWhen { false }
    doLast {
        def git = { List<String> args ->
            try {
                def p = new ProcessBuilder(['git'] + args).directory(rootDir).redirectErrorStream(true).start()
                def out = p.inputStream.getText('UTF-8')
                p.waitFor()
                return p.exitValue() == 0 ? out : null
            } catch (Exception e) {
                return null
            }
        }
        def full = git(['rev-parse', 'HEAD'])?.trim()
        def branch = git(['rev-parse', '--abbrev-ref', 'HEAD'])?.trim()
        def diff = git(['diff', 'HEAD'])
        def untracked = git(['ls-files', '--others', '--exclude-standard'])?.readLines()?.findAll { it } ?: []
        def changed = git(['diff', 'HEAD', '--name-only'])?.readLines()?.findAll { it } ?: []
        boolean known = full != null
        boolean dirty = known && (!changed.isEmpty() || !untracked.isEmpty())
        String fp = ''
        if (dirty) {
            def md = java.security.MessageDigest.getInstance('SHA-1')
            md.update((full + '\n' + (diff ?: '')).getBytes('UTF-8'))
            untracked.sort().each { f ->
                def h = git(['hash-object', f])?.trim() ?: '?'
                md.update(('\n' + f + ' ' + h).getBytes('UTF-8'))
            }
            fp = md.digest().encodeHex().toString().substring(0, 8)
        }
        String shortId = known ? full.substring(0, 7) : 'unknown'
        String builtAt = new Date().format("yyyy-MM-dd HH:mm:ss")
        def q = { String v -> (v ?: 'unknown').replaceAll('[\\\\"\r\n]', '_') }
        def dir = new File(buildInfoDir.get().asFile, 'org/firstinspires/ftc/teamcode/util')
        dir.mkdirs()
        new File(dir, 'BuildInfo.java').text = """package org.firstinspires.ftc.teamcode.util;

/** Generated by the generateBuildInfo task in TeamCode/build.gradle at every build; do not edit. Methods, not constants, so a rebuild is always picked up. */
public final class BuildInfo {
    private BuildInfo() { }
    public static String commit() { return "${q(shortId)}"; }
    public static String commitFull() { return "${q(full)}"; }
    public static String branch() { return "${q(branch)}"; }
    public static boolean dirty() { return ${dirty}; }
    public static int changedFiles() { return ${changed.size()}; }
    public static int newFiles() { return ${untracked.size()}; }
    public static String fingerprint() { return "${fp}"; }
    public static String builtAt() { return "${builtAt}"; }
    public static String summary() {
        return "commit " + commit() + " (" + branch() + "), built " + builtAt() + " (PC clock), "
                + (dirty() ? "UNCOMMITTED changes: " + changedFiles() + " file(s) changed, " + newFiles() + " new, fingerprint " + fingerprint() : "clean");
    }
}
"""
        def hist = new File(rootDir, 'build-history')
        hist.mkdirs()
        if (dirty && diff) {
            def patch = new File(hist, "${shortId}-${fp}.patch")
            if (!patch.exists()) patch.text = diff + (untracked ? '\n# untracked, not saved: ' + untracked.join(', ') + '\n' : '')
        }
        new File(hist, 'builds.csv').withWriterAppend('UTF-8') { w ->
            w.write("${builtAt},${shortId},${q(branch)},${dirty ? 'dirty' : 'clean'},${fp},${changed.size()},${untracked.size()}\n")
        }
    }
}
android.sourceSets.main.java.srcDir(buildInfoDir)
tasks.configureEach { t ->
    if (t.name == 'preBuild') t.dependsOn('generateBuildInfo')
    if (t.name.startsWith('compile') && t.name.endsWith('JavaWithJavac')) t.dependsOn('generateBuildInfo')
}

repositories {
    // FTC Dashboard. This is a standalone project (telemetry + live @Config
    // tuning + field overlay); it does NOT pull in Road Runner.
    maven { url = 'https://maven.brott.dev/' }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation 'com.acmerobotics.dashboard:dashboard:0.6.0'
}
